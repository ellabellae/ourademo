<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recovery — stress-aware view</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-soft: #1d2230;
    --text: #e7e9ee;
    --muted: #8b91a0;
    --accent: #7aa2ff;
    --good: #6fcf97;
    --warn: #f2c94c;
    --line: #2a2e38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 64px; }
  header h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: .2px; }
  header .date { color: var(--muted); font-size: 14px; }

  .signpost {
    margin: 20px 0 18px;
    padding: 14px 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, #232a3d, #1d2230);
    border: 1px solid #2f3a55;
  }
  .signpost .tag { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); font-weight: 600; }
  .signpost .msg { margin-top: 6px; font-size: 16px; }
  .signpost .note { margin-top: 8px; font-size: 13px; color: var(--muted); }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 8px 0 26px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    position: relative;
    overflow: hidden;
  }
  .card .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .card .value { font-size: 44px; font-weight: 650; margin-top: 6px; line-height: 1; }
  .card .delta { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .card .delta.up { color: var(--good); }
  .card .delta.down { color: var(--warn); }

  .card.softened .value { filter: blur(14px); transition: filter .35s ease; cursor: pointer; user-select: none; }
  .card.softened.revealed .value { filter: blur(0); }
  .card .reveal-hint {
    position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
    font-size: 12px; color: var(--muted); pointer-events: none;
  }
  .card.softened.revealed .reveal-hint { display: none; }
  .card:not(.softened) .reveal-hint { display: none; }

  h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 0 0 12px; }

  .trend { display: flex; align-items: flex-end; gap: 5px; height: 90px; padding: 10px 0 0; }
  .trend .bar { flex: 1; background: var(--accent); opacity: .5; border-radius: 3px 3px 0 0; min-height: 3px; }
  .trend .bar.today { opacity: 1; }
  .trend-x { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 6px; }

  .events { margin-top: 34px; }
  .event-list { list-style: none; padding: 0; margin: 0 0 14px; }
  .event-list li {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px;
    background: var(--card);
  }
  .event-list .meta { font-size: 14px; }
  .event-list .meta .type { color: var(--accent); font-weight: 600; }
  .event-list .meta .when { color: var(--muted); margin-left: 8px; font-size: 13px; }
  .event-list .in-window { font-size: 11px; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 2px 8px; margin-left: 8px; }
  .event-list button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px 8px; }
  .event-list button:hover { color: var(--text); }

  form.add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
  form.add input, form.add select {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 10px; font: inherit;
  }
  form.add button {
    background: var(--accent); color: #0f1115; border: none; border-radius: 9px;
    padding: 9px 16px; font-weight: 600; cursor: pointer;
  }
  .empty { color: var(--muted); font-size: 14px; font-style: italic; }

  .mode { margin-top: 34px; }
  .mode-row { display: flex; gap: 8px; }
  .mode select {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 10px; font: inherit; min-width: 260px;
  }
  .mode-note { color: var(--muted); font-size: 13px; margin: 10px 0 0; max-width: 56ch; }

  .feel { margin: -14px 0 26px; text-align: center; }
  .feel-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 4px 8px;
  }
  .feel-btn:hover { color: var(--text); }
  .feel-prompt { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
  .feel-prompt[hidden] { display: none; }
  .feel-prompt span { color: var(--muted); }
  .feel-prompt button {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .feel-prompt button[data-dir="better"]:hover { border-color: var(--good); color: var(--good); }
  .feel-prompt button[data-dir="worse"]:hover { border-color: var(--warn); color: var(--warn); }
  .feel-prompt .feel-cancel:hover { color: var(--text); border-color: var(--line); }
  .feel-ack { color: var(--good); font-size: 13px; }

  .calibration {
    margin: 18px 0; padding: 14px 16px; border-radius: 12px;
    background: linear-gradient(135deg, #1f2a24, #1b2420); border: 1px solid #2f4a3c;
  }
  .calibration.worse { background: linear-gradient(135deg, #2a2620, #241f1b); border-color: #4a3f2f; }
  .calibration .tag { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--good); font-weight: 600; }
  .calibration.worse .tag { color: var(--warn); }
  .calibration .msg { margin-top: 6px; font-size: 15px; }
  .calibration .msg em { font-style: normal; color: var(--good); }
  .calibration .note { margin-top: 8px; font-size: 13px; color: var(--muted); }

  footer { margin-top: 40px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Recovery</h1>
    <div class="date" id="today-label"></div>
  </header>

  <div id="signpost"></div>
  <div id="calibration"></div>

  <section class="cards">
    <div class="card" id="card-readiness">
      <div class="label">Readiness</div>
      <div class="value" id="val-readiness">--</div>
      <div class="delta" id="delta-readiness"></div>
      <div class="reveal-hint">tap to reveal</div>
    </div>
    <div class="card" id="card-sleep">
      <div class="label">Sleep</div>
      <div class="value" id="val-sleep">--</div>
      <div class="delta" id="delta-sleep"></div>
      <div class="reveal-hint">tap to reveal</div>
    </div>
  </section>

  <div class="feel" id="feel">
    <button class="feel-btn" id="feel-open" type="button">This doesn't quite match me</button>
    <div class="feel-prompt" id="feel-prompt" hidden>
      <span>Do you feel better or worse than this?</span>
      <button type="button" data-dir="better">Better</button>
      <button type="button" data-dir="worse">Worse</button>
      <button type="button" class="feel-cancel" data-dir="cancel">Cancel</button>
    </div>
    <div class="feel-ack" id="feel-ack" hidden></div>
  </div>

  <section>
    <h2>Readiness — last 14 days</h2>
    <div class="trend" id="trend"></div>
    <div class="trend-x" id="trend-x"></div>
  </section>

  <section class="mode">
    <h2>Softening mode</h2>
    <div class="mode-row">
      <select id="mode-select">
        <option value="both">Auto + manual stress events</option>
        <option value="auto">Auto only — lower-recovery mornings</option>
        <option value="manual">Manual stress events only</option>
        <option value="off">Off — always show raw scores</option>
      </select>
    </div>
    <p class="mode-note" id="mode-note"></p>
  </section>

  <section class="events">
    <h2>Stress events</h2>
    <ul class="event-list" id="event-list"></ul>
    <form class="add" id="add-form">
      <input type="date" id="ev-date" required />
      <select id="ev-type">
        <option value="exam">Exam</option>
        <option value="presentation">Presentation</option>
        <option value="deadline">Deadline</option>
        <option value="competition">Competition</option>
        <option value="other">Other</option>
      </select>
      <button type="submit">Add</button>
    </form>
  </section>

  <footer id="footer"></footer>
</div>

<script>
  // ---- Data injected at build time (real Oura data or sample fallback) ----
  const OURA_DATA = [{"day": "2026-05-22", "readiness": 81, "sleep": 78}, {"day": "2026-05-23", "readiness": 76, "sleep": 72}, {"day": "2026-05-24", "readiness": 88, "sleep": 84}, {"day": "2026-05-25", "readiness": 69, "sleep": 65}, {"day": "2026-05-26", "readiness": 73, "sleep": 70}, {"day": "2026-05-27", "readiness": 79, "sleep": 81}, {"day": "2026-05-28", "readiness": 84, "sleep": 77}, {"day": "2026-05-29", "readiness": 62, "sleep": 58}, {"day": "2026-05-30", "readiness": 71, "sleep": 74}, {"day": "2026-05-31", "readiness": 77, "sleep": 73}, {"day": "2026-06-01", "readiness": 66, "sleep": 61}, {"day": "2026-06-02", "readiness": 74, "sleep": 70}, {"day": "2026-06-03", "readiness": 82, "sleep": 79}, {"day": "2026-06-04", "readiness": 70, "sleep": 67}];
  const DATA_SOURCE = "sample";
  const GENERATED_AT = "2026-06-04 15:28";

  // ---- Config: the stress window around a logged event ----
  // today within [event - BEFORE days, event + AFTER days] => softened view.
  const STRESS_BEFORE = 2;
  const STRESS_AFTER = 1;

  // Reframe text keys off EVENT TYPE only, never the hidden score band.
  // This is the anti-leak rule: softening behavior must not encode the score.
  const EVENT_TYPES = {
    exam:         { label: "Exam",            message: "Big exam in your window. Your prep is done — steady sleep beats one more cram session." },
    presentation: { label: "Presentation",    message: "Presentation ahead. Presence and energy carry the room more than a perfect number." },
    deadline:     { label: "Deadline",        message: "Deadline crunch. Protect a couple of focus blocks; one real rest resets more than you'd think." },
    competition:  { label: "Competition",     message: "Competition in range. Trust the training you've banked and fuel for today." },
    other:        { label: "High-stakes day", message: "High-stakes stretch. Lead with what you can control today." }
  };

  const STORAGE_KEY = "ourademo.stressEvents";

  // ---- Softening mode (how softening is triggered) ----
  // "both"   → auto-detected lower-recovery mornings + manual stress windows
  // "auto"   → auto-detected lower-recovery mornings only (reaches you without logging)
  // "manual" → only inside windows around stress events you log
  // "off"    → never soften; always show raw scores
  const MODE_KEY = "ourademo.mode";
  const VALID_MODES = ["both", "auto", "manual", "off"];
  const DEFAULT_MODE = "both"; // default-on: the people most helped won't opt in.

  const MODE_NOTES = {
    both:   "Scores soften automatically on lower-recovery mornings, and during windows around stress events you log below.",
    auto:   "Scores soften automatically on lower-recovery mornings — no logging needed. This reaches you on the mornings you'd never think to flag.",
    manual: "Scores soften only inside windows around stress events you log below. Nothing softens on its own.",
    off:    "Scores are always shown raw, with day-over-day change and the 14-day trend."
  };

  // Auto-detection: soften when today's readiness is at or below an absolute
  // floor, or meaningfully below the recent baseline. NOTE the design tension —
  // unlike a manual stress window (which keys off the EVENT, never the score),
  // auto-softening is by definition correlated with a lower score. That's the
  // contract the user knowingly opts into. Both cards still blur uniformly, so it
  // never leaks WHICH metric is low — only that today reads a little lighter.
  const AUTO_FLOOR = 70;
  const AUTO_DROP = 5;

  // Auto-mode reframe keys off the trigger, not a specific event. It privileges
  // how you feel over the number — the article's exact failure mode (a good
  // morning undermined by a low score).
  const AUTO_MESSAGE = "Your recovery reads a little lower today. How you actually feel is just as real a signal — start there, and the number is one tap away when you want it.";

  // ---- "This doesn't quite match me": felt-experience log + personal calibration ----
  // The user logs when the score doesn't match how they feel ("better" or "worse").
  // Consistent, same-direction divergence nudges their PERSONAL NORMAL RANGE — never
  // the displayed score. The offset is derived fresh from the last 30 days of logs, so
  // it is bounded (CAL_MAX) and self-decaying (it shrinks as old logs age out).
  // NOTE for a real product: this demo learns from the disagreement alone. The honest
  // version would also gate on what actually happened next (did the "better" mornings
  // turn out fine, or end in a crash?) so it learns a true baseline, not flattery.
  const FEEL_KEY = "ourademo.feelLogs";
  const CAL_WINDOW = 30;       // rolling days considered
  const CAL_CONSECUTIVE = 5;   // 5 consecutive same-direction days -> trigger
  const CAL_CUMULATIVE = 10;   // ...or 10 same-direction days in the window
  const CAL_SHARE = 0.8;       // ...as long as >=80% point the same way
  const CAL_STEP = 2;          // points of personal-range shift per ~5 logs
  const CAL_MAX = 8;           // hard cap on how far the personal range can move

  // ---- Date helpers (all local-time, date-only) ----
  function isoDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function parseISO(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function daysApart(a, b) {
    // whole days from b to a (a - b), both midnight-local
    return Math.round((a.getTime() - b.getTime()) / 86400000);
  }

  // ---- Events persistence ----
  function loadEvents() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }
  function saveEvents(events) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
  }

  // ---- Mode persistence ----
  function loadMode() {
    try {
      const m = localStorage.getItem(MODE_KEY);
      return VALID_MODES.includes(m) ? m : DEFAULT_MODE;
    } catch (e) {
      return DEFAULT_MODE;
    }
  }
  function saveMode(m) {
    try { localStorage.setItem(MODE_KEY, VALID_MODES.includes(m) ? m : DEFAULT_MODE); } catch (e) {}
  }

  // ---- Auto-detection: is today a "lower-recovery morning"? ----
  // `offset` comes from personal calibration: <0 widens the normal range DOWN (a low
  // score is normal for you -> soften less); >0 is the gentler "feels worse" side.
  function autoSoftenToday(offset) {
    offset = offset || 0;
    if (!OURA_DATA.length) return false;
    const today = OURA_DATA[OURA_DATA.length - 1];
    if (!today || today.readiness == null) return false;
    const prior = OURA_DATA.slice(0, -1).map(d => d.readiness).filter(v => v != null);
    const baseline = prior.length ? prior.reduce((a, b) => a + b, 0) / prior.length : today.readiness;
    const floor = AUTO_FLOOR + offset;
    const drop = Math.max(2, AUTO_DROP - offset);
    return today.readiness <= floor || today.readiness <= baseline - drop;
  }

  // ---- Felt-experience log ("This doesn't quite match me") ----
  function loadFeelLogs() {
    try {
      const raw = localStorage.getItem(FEEL_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }
  function saveFeelLogs(logs) {
    try { localStorage.setItem(FEEL_KEY, JSON.stringify(logs)); } catch (e) {}
  }
  function addFeelLog(today, readiness, direction) {
    const logs = loadFeelLogs().filter(l => l.date !== isoDate(today)); // one log per day
    logs.push({ date: isoDate(today), readiness: readiness, direction: direction });
    saveFeelLogs(logs);
  }

  // True if there's a run of `need` consecutive calendar days (within the window),
  // all the given direction.
  function hasConsecutiveRun(today, logs, dir, need) {
    const byDate = {};
    for (const l of logs) byDate[l.date] = l.direction; // last write per day wins
    let run = 0;
    for (let i = 0; i < CAL_WINDOW; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      if (byDate[isoDate(d)] === dir) {
        run++;
        if (run >= need) return true;
      } else {
        run = 0;
      }
    }
    return false;
  }

  // Derive the personal-range offset from recent logs. Same-direction consistency only:
  // mixed signals mean a variable person, not a wrong baseline, so we don't move it.
  // Returns { offset, direction, count, triggered }.
  function calibrationOffset(today, logs) {
    const within = (logs || []).filter(l => {
      const d = daysApart(today, parseISO(l.date));
      return d >= 0 && d < CAL_WINDOW;
    });
    const better = within.filter(l => l.direction === "better").length;
    const worse = within.filter(l => l.direction === "worse").length;
    const total = better + worse;
    if (!total) return { offset: 0, direction: null, count: 0, triggered: false };

    const direction = better >= worse ? "better" : "worse";
    const dominant = Math.max(better, worse);
    const share = dominant / total;

    const cumulative = total >= CAL_CUMULATIVE && share >= CAL_SHARE;
    const consecutive = hasConsecutiveRun(today, within, direction, CAL_CONSECUTIVE);
    if (!(cumulative || consecutive)) {
      return { offset: 0, direction: direction, count: dominant, triggered: false };
    }

    // Gradual + bounded: ~CAL_STEP points per 5 consistent logs, capped at CAL_MAX.
    const mag = Math.min(CAL_MAX, CAL_STEP * Math.max(1, Math.round(dominant / CAL_CONSECUTIVE)));
    return { offset: direction === "better" ? -mag : mag, direction: direction, count: dominant, triggered: true };
  }

  // Returns the matching event if today falls in any stress window, else null.
  function activeWindow(today, events) {
    for (const ev of events) {
      const diff = daysApart(today, parseISO(ev.date)); // <0 before event, >0 after
      if (diff >= -STRESS_BEFORE && diff <= STRESS_AFTER) return ev;
    }
    return null;
  }
  function eventInWindow(today, ev) {
    const diff = daysApart(today, parseISO(ev.date));
    return diff >= -STRESS_BEFORE && diff <= STRESS_AFTER;
  }

  // ---- Rendering ----
  function render() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    document.getElementById("today-label").textContent = today.toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric"
    });

    const mode = loadMode();
    const feelLogs = loadFeelLogs();
    const cal = calibrationOffset(today, feelLogs);

    let events = loadEvents();
    // ?demo seeds an ephemeral event for today so the softened view is visible
    // immediately, without persisting anything to the visitor's localStorage.
    const demoMode = /(?:[?&])demo(?:=|&|$)/.test(location.search);
    if (demoMode) {
      events = events.concat([{ id: "demo", date: isoDate(today), type: "exam", demo: true }]);
    }

    // Two independent triggers, gated by the chosen mode.
    const manualActive = (mode === "both" || mode === "manual") ? activeWindow(today, events) : null;
    const autoActive = (mode === "both" || mode === "auto") ? autoSoftenToday(cal.offset) : false;
    const softened = !!manualActive || autoActive;

    renderSignpost(softened, manualActive, autoActive);
    renderCalibration(cal);
    renderScores(softened, cal);
    renderFeel();
    renderTrend();
    renderMode(mode);
    renderEvents(today, events);
    renderFooter();
  }

  function latestAndPrev() {
    if (!OURA_DATA.length) return [null, null];
    const latest = OURA_DATA[OURA_DATA.length - 1];
    const prev = OURA_DATA.length > 1 ? OURA_DATA[OURA_DATA.length - 2] : null;
    return [latest, prev];
  }

  function renderSignpost(softened, manualActive, autoActive) {
    const el = document.getElementById("signpost");
    if (!softened) { el.innerHTML = ""; return; }
    // Manual stress windows take precedence: the event reframe is more specific.
    if (manualActive) {
      const type = EVENT_TYPES[manualActive.type] || EVENT_TYPES.other;
      el.innerHTML = `
        <div class="tag">Stress-window view</div>
        <div class="msg">${type.message}</div>
        <div class="note">Your scores are softened, not hidden — tap any score to see the exact number.</div>
      `;
    } else {
      el.innerHTML = `
        <div class="tag">Lower-recovery morning</div>
        <div class="msg">${AUTO_MESSAGE}</div>
        <div class="note">Your scores are softened, not hidden — tap any score to see the exact number.</div>
      `;
    }
  }

  function renderMode(mode) {
    const sel = document.getElementById("mode-select");
    if (sel) sel.value = mode;
    const note = document.getElementById("mode-note");
    if (note) note.textContent = MODE_NOTES[mode] || "";
  }

  function renderCalibration(cal) {
    const el = document.getElementById("calibration");
    if (!cal || !cal.triggered) { el.className = ""; el.innerHTML = ""; return; }
    const floor = AUTO_FLOOR + cal.offset;
    if (cal.direction === "better") {
      el.className = "calibration";
      el.innerHTML = `
        <div class="tag">Your personal range is adapting</div>
        <div class="msg">You've said this doesn't match you on ${cal.count} recent mornings — mostly that you feel better than your score. Oura has widened your normal range: a readiness near ${floor} now reads as normal <em>for you</em>.</div>
        <div class="note">The number itself is unchanged — only what counts as “normal” for you. This drifts back on its own if it stops matching.</div>
      `;
    } else {
      el.className = "calibration worse";
      el.innerHTML = `
        <div class="tag">Your personal range is adapting</div>
        <div class="msg">You've said this doesn't match you on ${cal.count} recent mornings — mostly that you feel worse than your score. Oura is being gentler with how it surfaces these days.</div>
        <div class="note">A lower felt state is worth attention, not just a smaller number — it can help to add a note or talk with someone you trust.</div>
      `;
    }
  }

  // Felt-experience control state: idle (link) -> prompt (better/worse) -> ack.
  let feelState = "idle";
  let feelAckMsg = "";
  function renderFeel() {
    const open = document.getElementById("feel-open");
    const prompt = document.getElementById("feel-prompt");
    const ack = document.getElementById("feel-ack");
    open.hidden = feelState !== "idle";
    prompt.hidden = feelState !== "prompt";
    ack.hidden = feelState !== "ack";
    if (feelState === "ack") ack.textContent = feelAckMsg;
  }

  function renderScores(softened, cal) {
    const [latest, prev] = latestAndPrev();
    setScore("readiness", latest, prev, softened, cal);
    setScore("sleep", latest, prev, softened, null);
  }

  function setScore(key, latest, prev, softened, cal) {
    const card = document.getElementById("card-" + key);
    const valEl = document.getElementById("val-" + key);
    const deltaEl = document.getElementById("delta-" + key);

    card.classList.remove("softened", "revealed");
    deltaEl.className = "delta";

    if (!latest || latest[key] == null) {
      valEl.textContent = "--";
      deltaEl.textContent = "";
      return;
    }
    valEl.textContent = latest[key];

    if (softened) {
      // Uniform across all score bands — blur every score, never only low ones.
      card.classList.add("softened");
      deltaEl.textContent = "";
    } else if (cal && cal.triggered && cal.direction === "better" && key === "readiness"
               && latest[key] >= (AUTO_FLOOR + cal.offset)) {
      // Personal calibration: this reads as normal for *you*, the number unchanged.
      deltaEl.textContent = "normal for you";
      deltaEl.classList.add("up");
    } else if (prev && prev[key] != null) {
      const d = latest[key] - prev[key];
      const arrow = d > 0 ? "▲" : d < 0 ? "▼" : "→";
      deltaEl.textContent = `${arrow} ${Math.abs(d)} vs yesterday`;
      deltaEl.classList.add(d > 0 ? "up" : d < 0 ? "down" : "");
    } else {
      deltaEl.textContent = "";
    }
  }

  function renderTrend() {
    const trend = document.getElementById("trend");
    const xAxis = document.getElementById("trend-x");
    trend.innerHTML = "";
    xAxis.innerHTML = "";
    if (!OURA_DATA.length) return;

    const vals = OURA_DATA.map(d => d.readiness).filter(v => v != null);
    const max = Math.max(...vals, 1);
    OURA_DATA.forEach((d, i) => {
      const bar = document.createElement("div");
      bar.className = "bar" + (i === OURA_DATA.length - 1 ? " today" : "");
      const h = d.readiness != null ? Math.round((d.readiness / max) * 100) : 0;
      bar.style.height = h + "%";
      bar.title = `${d.day}: ${d.readiness}`;
      trend.appendChild(bar);
    });

    const first = document.createElement("span");
    first.textContent = OURA_DATA[0].day.slice(5);
    const last = document.createElement("span");
    last.textContent = OURA_DATA[OURA_DATA.length - 1].day.slice(5);
    xAxis.appendChild(first);
    xAxis.appendChild(last);
  }

  function renderEvents(today, events) {
    const list = document.getElementById("event-list");
    list.innerHTML = "";
    if (!events.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No stress events logged. Add one dated today to see the softened view.";
      list.appendChild(li);
      return;
    }
    // Sort by date ascending for stable display.
    const sorted = [...events].sort((a, b) => a.date.localeCompare(b.date));
    for (const ev of sorted) {
      const type = EVENT_TYPES[ev.type] || EVENT_TYPES.other;
      const li = document.createElement("li");
      const inWin = eventInWindow(today, ev);
      li.innerHTML = `
        <span class="meta">
          <span class="type">${type.label}</span>
          <span class="when">${parseISO(ev.date).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</span>
          ${inWin ? '<span class="in-window">in window</span>' : ""}
          ${ev.demo ? '<span class="in-window" style="color:var(--muted);border-color:var(--line)">demo</span>' : ""}
        </span>
      `;
      if (!ev.demo) {
        const btn = document.createElement("button");
        btn.textContent = "×";
        btn.setAttribute("aria-label", "Remove event");
        btn.addEventListener("click", () => removeEvent(ev.id));
        li.appendChild(btn);
      }
      list.appendChild(li);
    }
  }

  function renderFooter() {
    const src = DATA_SOURCE === "oura" ? "your Oura account" : "sample data";
    document.getElementById("footer").textContent =
      `Data: ${src} · generated ${GENERATED_AT}. Stress windows are self-set and stored only in this browser.`;
  }

  function removeEvent(id) {
    saveEvents(loadEvents().filter(e => e.id !== id));
    render();
  }

  // ---- Wiring ----
  document.getElementById("add-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const date = document.getElementById("ev-date").value;
    const type = document.getElementById("ev-type").value;
    if (!date) return;
    const events = loadEvents();
    events.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date, type });
    saveEvents(events);
    document.getElementById("add-form").reset();
    setDefaultDate();
    render();
  });

  // Mode selector: persist choice and re-render.
  document.getElementById("mode-select").addEventListener("change", (e) => {
    saveMode(e.target.value);
    render();
  });

  // "This doesn't quite match me" → open the better/worse prompt.
  document.getElementById("feel-open").addEventListener("click", () => {
    feelState = "prompt";
    renderFeel();
  });
  // Log the felt direction (or cancel), then re-render so calibration updates.
  document.getElementById("feel-prompt").addEventListener("click", (e) => {
    const dir = e.target.getAttribute("data-dir");
    if (!dir) return;
    if (dir === "cancel") { feelState = "idle"; renderFeel(); return; }
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const [latest] = latestAndPrev();
    addFeelLog(t, latest ? latest.readiness : null, dir);
    feelAckMsg = "Noted — your read counts. Oura is learning your baseline.";
    feelState = "ack";
    render();
  });

  // Tap-to-reveal: click a softened card to unblur just that card.
  ["readiness", "sleep"].forEach(key => {
    document.getElementById("card-" + key).addEventListener("click", function () {
      if (this.classList.contains("softened")) this.classList.toggle("revealed");
    });
  });

  function setDefaultDate() {
    const t = new Date();
    document.getElementById("ev-date").value = isoDate(t);
  }

  setDefaultDate();
  render();
</script>
</body>
</html>
